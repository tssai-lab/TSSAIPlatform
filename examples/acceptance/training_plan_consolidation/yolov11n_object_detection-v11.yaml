schemaVersion: tss.training.plan/v2
id: yolov11n_object_detection_gpu_acceptance
version: v11
displayName: YOLO11n 目标检测
description: 使用同一套 YOLO11n 权重、YOLO 数据集和训练代码，可按需选择 CPU 或单卡 NVIDIA GPU。
category: CV
enabled: true
trainingModes: [FULL_FINETUNE]

execution:
  interpreter: python
  entrypoint: train.py
  arguments: [--model-dir, "${MODEL_DIR}", --data-dir, "${DATA_DIR}", --output-dir, "${OUTPUT_DIR}", --params-file, "${PARAMS_FILE}", --device, "${DEVICE}"]

inputs:
  model:
    required: true
    consumed: true
    acceptedSpecIds: [model.cv.yolo-weight/v1]
  dataset:
    required: true
    acceptedSpecIds: [dataset.cv.yolo/v1]
  code:
    required: true
    approvalRequired: true
    runtime: PYTHON3

parameters:
  - name: epochs
    displayName: 训练轮数
    type: INTEGER
    required: false
    defaultValue: 1
    minimum: 1
    maximum: 20
  - name: batch
    displayName: 批大小
    type: INTEGER
    required: false
    defaultValue: 1
    minimum: 1
    maximum: 16
  - name: imgsz
    displayName: 输入图片尺寸
    type: INTEGER
    required: false
    defaultValue: 64
    minimum: 64
    maximum: 640
  - name: learningRate
    displayName: 学习率
    type: NUMBER
    required: false
    defaultValue: 0.001
    minimum: 0.000001
    maximum: 0.1

runtimes:
  - id: cv-cpu
    deviceType: CPU
    image: crpi-s1uie3z8n3mbqf6y.cn-shanghai.personal.cr.aliyuncs.com/tss-platform/tss-cv-worker@sha256:c319dc2ffc58119d0fa130b46eb90b8ab9b45e0e8e06683329dbbf75e69cb310
    imagePullPolicy: IfNotPresent
    productionDigestRequired: true
    resourceProfiles:
      - id: cpu-yolo-tiny
        cpuRequest: "1"
        cpuLimit: "4"
        memoryRequest: 4Gi
        memoryLimit: 8Gi
        ephemeralStorageLimit: 12Gi
        gpuCount: 0
        nodeSelector:
          tss.ai/node-pool: cpu
  - id: cv-gpu
    deviceType: NVIDIA_GPU
    image: crpi-s1uie3z8n3mbqf6y.cn-shanghai.personal.cr.aliyuncs.com/tss-platform/tss-cv-worker@sha256:ac1b80ada945a230b2706873060cdd8b396370cf41b5f7cf47e05746361b478f
    imagePullPolicy: IfNotPresent
    productionDigestRequired: true
    resourceProfiles:
      - id: gpu-yolo-tiny
        cpuRequest: "1"
        cpuLimit: "4"
        memoryRequest: 4Gi
        memoryLimit: 8Gi
        ephemeralStorageLimit: 12Gi
        gpuCount: 1
        nodeSelector:
          tss.ai/accelerator: nvidia

outputs:
  progressProtocol: TSS_EVENT_JSONL_V1
  metricsPath: metrics.json
  logPath: train.log
  artifacts:
    - path: model.zip
      role: PRIMARY_MODEL
      required: true
      format: YOLO_WEIGHT_ZIP
      publishAsModel: true
      publishedModelSpecId: model.cv.yolo-weight/v1
    - path: last.pt
      role: CHECKPOINT
      required: true
      format: YOLO_PT
      publishAsModel: false
    - path: metrics.json
      role: METRICS
      required: true
      format: JSON
      publishAsModel: false
    - path: train.log
      role: LOG
      required: true
      format: TEXT
      publishAsModel: false

security:
  networkPolicy: PLATFORM_SERVICES_ONLY
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  automountServiceAccountToken: false
  maxRuntimeSeconds: 7200
