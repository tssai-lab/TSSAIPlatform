apiVersion: v1
kind: Service
metadata:
  name: tss-postgres
  namespace: tss-poc
  labels:
    app.kubernetes.io/name: tss-postgres
    app.kubernetes.io/part-of: tss-poc
spec:
  selector:
    app.kubernetes.io/name: tss-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tss-postgres
  namespace: tss-poc
  labels:
    app.kubernetes.io/name: tss-postgres
    app.kubernetes.io/part-of: tss-poc
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tss-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tss-postgres
        app.kubernetes.io/part-of: tss-poc
    spec:
      containers:
        - name: postgres
          image: postgres:16.13
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: tss_poc
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tss-poc-datastore
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - pg_isready -U postgres -d tss_poc
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -ec
                - pg_isready -U postgres -d tss_poc
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 2Gi
