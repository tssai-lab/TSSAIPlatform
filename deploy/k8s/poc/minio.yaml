apiVersion: v1
kind: Service
metadata:
  name: tss-minio
  namespace: tss-poc
  labels:
    app.kubernetes.io/name: tss-minio
    app.kubernetes.io/part-of: tss-poc
spec:
  selector:
    app.kubernetes.io/name: tss-minio
  ports:
    - name: api
      port: 9000
      targetPort: api
    - name: console
      port: 9001
      targetPort: console
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tss-minio
  namespace: tss-poc
  labels:
    app.kubernetes.io/name: tss-minio
    app.kubernetes.io/part-of: tss-poc
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tss-minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tss-minio
        app.kubernetes.io/part-of: tss-poc
    spec:
      containers:
        - name: minio
          image: minio/minio@sha256:d786220feef7d8fe0239d41b5d74501dc824f6e7dd0e5a05749c502fff225bf3
          args:
            - server
            - /data
            - --console-address
            - :9001
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: tss-poc-datastore
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tss-poc-datastore
                  key: MINIO_ROOT_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /minio/health/live
              port: api
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: api
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 2Gi
