apiVersion: v1
kind: Service
metadata:
  name: tss-backend
  namespace: tss-poc
  labels:
    app.kubernetes.io/name: tss-backend
    app.kubernetes.io/part-of: tss-poc
spec:
  selector:
    app.kubernetes.io/name: tss-backend
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tss-backend
  namespace: tss-poc
  labels:
    app.kubernetes.io/name: tss-backend
    app.kubernetes.io/part-of: tss-poc
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tss-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tss-backend
        app.kubernetes.io/part-of: tss-poc
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      initContainers:
        - name: wait-for-datastores
          image: busybox:1.36.1
          command:
            - sh
            - -ec
            - |
              until nc -z tss-postgres 5432; do sleep 2; done
              until nc -z tss-minio 9000; do sleep 2; done
      containers:
        - name: app
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: tss-backend-runtime
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1536Mi
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 36
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 10001
