apiVersion: batch/v1
kind: Job
metadata:
  name: tss-backend-access-probe
  namespace: tss-training
  labels:
    app.kubernetes.io/name: tss-backend-access-probe
    app.kubernetes.io/part-of: tss-platform
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 30
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tss-backend-access-probe
    spec:
      serviceAccountName: tss-training-worker
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: probe
          image: busybox:1.36
          command: ["/bin/true"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 20m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
