name: Deploy Backend POC

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Commit SHA image tag produced by Backend CI and Image
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tss-backend-poc
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: poc
    env:
      DEPLOY_HOST: ${{ vars.POC_DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.POC_DEPLOY_USER }}
      IMAGE_TAG: ${{ inputs.image_tag }}
    steps:
      - name: Check out deployment files
        uses: actions/checkout@v4

      - name: Validate deployment inputs
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          case "$IMAGE_TAG" in
            *[!a-zA-Z0-9._-]*|'') exit 1 ;;
          esac

      - name: Load POC deployment key
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.POC_DEPLOY_SSH_PRIVATE_KEY }}

      - name: Trust Main server host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Render immutable image reference
        run: |
          cp -R deploy/k8s/poc "${RUNNER_TEMP}/poc"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/tssai-backend:${IMAGE_TAG}"
          sed -i "s|IMAGE_PLACEHOLDER|${image}|g" "${RUNNER_TEMP}/poc/backend.yaml"

      - name: Upload manifests to Main server
        run: |
          scp -r "${RUNNER_TEMP}/poc" "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/tss-poc-${GITHUB_RUN_ID}"

      - name: Apply and verify POC
        run: |
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "
            set -euo pipefail
            kubectl -n tss-poc get secret tss-poc-datastore tss-backend-runtime ghcr-pull >/dev/null
            kubectl apply -k /tmp/tss-poc-${GITHUB_RUN_ID}
            kubectl -n tss-poc rollout status deployment/tss-postgres --timeout=180s
            kubectl -n tss-poc rollout status deployment/tss-minio --timeout=180s
            kubectl -n tss-poc rollout status deployment/tss-backend --timeout=240s
            kubectl -n tss-poc get deployments,pods,services -o wide
          "
