name: tss-AIplatform Internal Cluster Validation

on:
  pull_request:
    paths:
      - "deploy/tss-aiplatform-internal/**"
      - ".github/workflows/tss-aiplatform-internal-validation.yml"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - backend
      - backend-ops
    paths:
      - "deploy/tss-aiplatform-internal/**"
      - ".github/workflows/tss-aiplatform-internal-validation.yml"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:
    inputs:
      task:
        description: Safe internal-cluster task to run
        required: true
        default: contract
        type: choice
        options:
          - contract
          - runner-smoke
          - resolve-artifact-lock
          - export-airgap-bundles
          - export-platform-images
          - export-cpu-runtime-images
          - stage-airgap-bundles
          - stage-platform-images
          - stage-cpu-runtime-images
      airgap_run_id:
        description: Successful export workflow run ID (staging task only)
        required: false
        type: string
      airgap_head_sha:
        description: Exact backend-ops SHA used by the export run (staging task only)
        required: false
        type: string
      runtime_run_id:
        description: Successful CPU runtime export workflow run ID (runtime staging only)
        required: false
        type: string
      runtime_head_sha:
        description: Exact backend-ops SHA used by the CPU runtime export run
        required: false
        type: string
      platform_run_id:
        description: Successful platform-image export workflow run ID
        required: false
        type: string
      platform_head_sha:
        description: Exact backend-ops SHA used by the platform-image export run
        required: false
        type: string

permissions:
  contents: read
  actions: read
  packages: read

concurrency:
  group: tss-internal-cluster-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-contract:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.task == 'contract'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate internal cluster copy contract
        run: |
          bash deploy/tss-aiplatform-internal/tests/test-cluster-copy.sh
          bash deploy/tss-aiplatform-internal/tests/test-platform-copy.sh

  runner-smoke:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.task == 'runner-smoke'
    runs-on: [self-hosted, Linux, X64, seu4080, deploy]
    environment: tss-aiplatform-internal
    timeout-minutes: 10
    steps:
      - name: Check out trusted backend-ops source
        uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false

      - name: Verify isolated Runner data paths
        env:
          CONTROL_PLANE_HOST: ${{ vars.CONTROL_PLANE_HOST }}
        run: |
          [[ "$GITHUB_REF" == "refs/heads/backend-ops" ]]
          test -n "$CONTROL_PLANE_HOST"
          [[ "$CONTROL_PLANE_HOST" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}$ ]]
          [[ "$GITHUB_WORKSPACE" == /media/seu/data/tssai-platform/actions-runner/_work/* ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Verify GitHub data path and control-plane TCP reachability
        env:
          CONTROL_PLANE_HOST: ${{ vars.CONTROL_PLANE_HOST }}
        run: |
          for attempt in 1 2 3; do
            git ls-remote origin HEAD >/dev/null
            curl --fail --silent --show-error --max-time 15 \
              https://api.github.com/repos/tssai-lab/TSSAIPlatform >/dev/null
          done
          timeout 5 bash -c "</dev/tcp/${CONTROL_PLANE_HOST}/22"

      - name: Record non-deployment result
        run: |
          {
            echo "### Internal Runner smoke"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Runner: \`${RUNNER_NAME}\`"
            echo "- GitHub fetch: passed 3/3"
            echo "- Control-plane TCP/22: reachable"
            echo "- SSH authentication, sudo, deployment and host writes: not attempted"
          } >> "$GITHUB_STEP_SUMMARY"

  resolve-artifact-lock:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.task == 'resolve-artifact-lock'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out trusted source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve immutable manifest and image digests
        run: |
          bash deploy/tss-aiplatform-internal/ci/resolve-artifact-lock.sh \
            > "$RUNNER_TEMP/tss-aiplatform-artifacts.lock"

      - name: Upload candidate lock
        uses: actions/upload-artifact@v4
        with:
          name: tss-aiplatform-artifact-lock-${{ github.sha }}
          path: ${{ runner.temp }}/tss-aiplatform-artifacts.lock
          if-no-files-found: error
          retention-days: 7

  export-airgap-bundles:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.task == 'export-airgap-bundles'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out trusted backend-ops source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Export digest-locked linux-amd64 image bundles
        run: |
          bash deploy/tss-aiplatform-internal/ci/export-airgap-bundles.sh \
            "$RUNNER_TEMP/tss-aiplatform-airgap"

      - name: Upload short-lived air-gap bundles
        uses: actions/upload-artifact@v4
        with:
          name: tss-aiplatform-airgap-${{ github.sha }}
          path: ${{ runner.temp }}/tss-aiplatform-airgap
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  export-platform-images:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.task == 'export-platform-images'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out trusted source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Log in to the project image registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Export four registry-locked platform images
        run: |
          set -Eeuo pipefail
          output_dir="$RUNNER_TEMP/tss-aiplatform-platform-images"
          install -d -m 0700 "$output_dir"
          bash deploy/tss-aiplatform-internal/platform/scripts/export-platform-images.sh \
            > "$output_dir/platform-images-amd64.tar"
          cp deploy/tss-aiplatform-internal/platform/platform-images.lock \
            "$output_dir/sources.lock"
          (
            cd "$output_dir"
            sha256sum platform-images-amd64.tar sources.lock \
              > platform-images.sha256
            sha256sum --check --strict platform-images.sha256
          )

      - name: Upload reproducible platform-image bundle
        uses: actions/upload-artifact@v4
        with:
          name: tss-aiplatform-platform-images-${{ github.sha }}
          path: ${{ runner.temp }}/tss-aiplatform-platform-images
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  export-cpu-runtime-images:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.task == 'export-cpu-runtime-images'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out trusted backend-ops source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Log in to the project image registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Export only the C6 CPU training and inference images
        run: |
          bash deploy/tss-aiplatform-internal/ci/export-cpu-runtime-images.sh \
            "$RUNNER_TEMP/tss-aiplatform-cpu-runtime"

      - name: Upload short-lived CPU runtime bundle
        uses: actions/upload-artifact@v4
        with:
          name: tss-aiplatform-cpu-runtime-${{ github.sha }}
          path: ${{ runner.temp }}/tss-aiplatform-cpu-runtime
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  stage-airgap-bundles:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.task == 'stage-airgap-bundles'
    runs-on: [self-hosted, Linux, X64, seu4080, deploy]
    environment: tss-aiplatform-internal
    timeout-minutes: 30
    steps:
      - name: Check out trusted backend-ops source
        uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false

      - name: Verify trusted export run and isolated staging path
        env:
          AIRGAP_RUN_ID: ${{ inputs.airgap_run_id }}
          AIRGAP_HEAD_SHA: ${{ inputs.airgap_head_sha }}
          AIRGAP_STAGE_ROOT: ${{ vars.AIRGAP_STAGE_ROOT }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF" == "refs/heads/backend-ops" ]]
          [[ "$GITHUB_SHA" == "$AIRGAP_HEAD_SHA" ]]
          [[ "$AIRGAP_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$AIRGAP_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$AIRGAP_STAGE_ROOT" == /* ]]
          test -d "$AIRGAP_STAGE_ROOT"
          test ! -L "$AIRGAP_STAGE_ROOT"
          test "$(stat -c %U "$AIRGAP_STAGE_ROOT")" = "$(id -un)"
          stage_mode="$(stat -c %a "$AIRGAP_STAGE_ROOT")"
          (( (8#$stage_mode & 0022) == 0 ))
          stage_root="$(realpath -e "$AIRGAP_STAGE_ROOT")"
          test "$stage_root" = "$AIRGAP_STAGE_ROOT"
          target_dir="${stage_root}/${AIRGAP_HEAD_SHA}-${AIRGAP_RUN_ID}"
          test ! -e "$target_dir"
          test ! -L "$target_dir"

          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${AIRGAP_RUN_ID}" \
            --output "$RUNNER_TEMP/airgap-export-run.json"
          python3 - "$RUNNER_TEMP/airgap-export-run.json" \
            "$AIRGAP_HEAD_SHA" <<'PY'
          import json
          import sys

          metadata_path, expected_sha = sys.argv[1:]
          with open(metadata_path, encoding="utf-8") as metadata_file:
              metadata = json.load(metadata_file)
          expected = {
              "head_sha": expected_sha,
              "head_branch": "backend-ops",
              "event": "workflow_dispatch",
              "status": "completed",
              "conclusion": "success",
              "path": ".github/workflows/tss-aiplatform-internal-validation.yml",
          }
          mismatches = {
              key: (metadata.get(key), value)
              for key, value in expected.items()
              if metadata.get(key) != value
          }
          if mismatches:
              raise SystemExit(f"untrusted export workflow metadata: {mismatches}")
          PY

      - name: Download exact short-lived air-gap artifact in verified ranges
        env:
          AIRGAP_RUN_ID: ${{ inputs.airgap_run_id }}
          AIRGAP_HEAD_SHA: ${{ inputs.airgap_head_sha }}
          AIRGAP_STAGE_ROOT: ${{ vars.AIRGAP_STAGE_ROOT }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 deploy/tss-aiplatform-internal/ci/download-airgap-artifact.py \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$AIRGAP_RUN_ID" \
            --head-sha "$AIRGAP_HEAD_SHA" \
            --stage-root "$AIRGAP_STAGE_ROOT" \
            --workers 16

      - name: Verify staged bundle before any image import
        env:
          AIRGAP_RUN_ID: ${{ inputs.airgap_run_id }}
          AIRGAP_HEAD_SHA: ${{ inputs.airgap_head_sha }}
          AIRGAP_STAGE_ROOT: ${{ vars.AIRGAP_STAGE_ROOT }}
        run: |
          set -Eeuo pipefail
          target_dir="${AIRGAP_STAGE_ROOT}/${AIRGAP_HEAD_SHA}-${AIRGAP_RUN_ID}"
          test -d "$target_dir"
          test ! -L "$target_dir"
          test "$(find "$target_dir" -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 6
          test "$(find "$target_dir" -mindepth 1 -maxdepth 1 ! -type f | wc -l)" -eq 0
          (
            cd "$target_dir"
            test "$(awk '{print $2}' airgap-common.sha256)" = $'k8s-core-amd64.tar\ncalico-amd64.tar\nsources.lock'
            test "$(awk '{print $2}' airgap-gpu.sha256)" = nvidia-amd64.tar
            sha256sum --check --strict airgap-common.sha256
            sha256sum --check --strict airgap-gpu.sha256
            cmp <(grep '^image ' "$GITHUB_WORKSPACE/deploy/tss-aiplatform-internal/artifacts.lock") sources.lock
            test "$(grep -c '^image ' sources.lock)" -eq 11
          )

      - name: Record staged artifact result
        env:
          AIRGAP_RUN_ID: ${{ inputs.airgap_run_id }}
          AIRGAP_HEAD_SHA: ${{ inputs.airgap_head_sha }}
          AIRGAP_STAGE_ROOT: ${{ vars.AIRGAP_STAGE_ROOT }}
        run: |
          {
            echo "### Internal air-gap staging"
            echo "- Export run: \`${AIRGAP_RUN_ID}\`"
            echo "- Source SHA: \`${AIRGAP_HEAD_SHA}\`"
            echo "- Stage: \`${AIRGAP_STAGE_ROOT}/${AIRGAP_HEAD_SHA}-${AIRGAP_RUN_ID}\`"
            echo "- Checksums and 11-source lock: passed"
            echo "- sudo, containerd import and cluster writes: not attempted"
          } >> "$GITHUB_STEP_SUMMARY"

  stage-cpu-runtime-images:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.task == 'stage-cpu-runtime-images'
    runs-on: [self-hosted, Linux, X64, seu4080, deploy]
    environment: tss-aiplatform-internal
    timeout-minutes: 60
    steps:
      - name: Check out trusted backend-ops source
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false

      - name: Verify trusted CPU runtime export and isolated staging path
        env:
          RUNTIME_RUN_ID: ${{ inputs.runtime_run_id }}
          RUNTIME_HEAD_SHA: ${{ inputs.runtime_head_sha }}
          AIRGAP_STAGE_ROOT: ${{ vars.AIRGAP_STAGE_ROOT }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF" == "refs/heads/backend-ops" ]]
          [[ "$RUNTIME_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$RUNTIME_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$RUNTIME_HEAD_SHA" "$GITHUB_SHA"
          [[ "$AIRGAP_STAGE_ROOT" == /* ]]
          test -d "$AIRGAP_STAGE_ROOT"
          test ! -L "$AIRGAP_STAGE_ROOT"
          test "$(stat -c %U "$AIRGAP_STAGE_ROOT")" = "$(id -un)"
          stage_mode="$(stat -c %a "$AIRGAP_STAGE_ROOT")"
          (( (8#$stage_mode & 0022) == 0 ))
          stage_root="$(realpath -e "$AIRGAP_STAGE_ROOT")"
          test "$stage_root" = "$AIRGAP_STAGE_ROOT"
          target_dir="${stage_root}/${RUNTIME_HEAD_SHA}-${RUNTIME_RUN_ID}"
          test ! -e "$target_dir"
          test ! -L "$target_dir"

          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUNTIME_RUN_ID}" \
            --output "$RUNNER_TEMP/runtime-export-run.json"
          python3 - "$RUNNER_TEMP/runtime-export-run.json" \
            "$RUNTIME_HEAD_SHA" <<'PY'
          import json
          import sys

          metadata_path, expected_sha = sys.argv[1:]
          with open(metadata_path, encoding="utf-8") as metadata_file:
              metadata = json.load(metadata_file)
          expected = {
              "head_sha": expected_sha,
              "head_branch": "backend-ops",
              "event": "workflow_dispatch",
              "status": "completed",
              "conclusion": "success",
              "path": ".github/workflows/tss-aiplatform-internal-validation.yml",
          }
          mismatches = {
              key: (metadata.get(key), value)
              for key, value in expected.items()
              if metadata.get(key) != value
          }
          if mismatches:
              raise SystemExit(f"untrusted CPU runtime export metadata: {mismatches}")
          PY

      - name: Download exact CPU runtime artifact in verified ranges
        env:
          RUNTIME_RUN_ID: ${{ inputs.runtime_run_id }}
          RUNTIME_HEAD_SHA: ${{ inputs.runtime_head_sha }}
          AIRGAP_STAGE_ROOT: ${{ vars.AIRGAP_STAGE_ROOT }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 deploy/tss-aiplatform-internal/ci/download-airgap-artifact.py \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$RUNTIME_RUN_ID" \
            --head-sha "$RUNTIME_HEAD_SHA" \
            --stage-root "$AIRGAP_STAGE_ROOT" \
            --profile cpu-runtime \
            --workers 16

      - name: Verify staged CPU runtime bundle before import
        env:
          RUNTIME_RUN_ID: ${{ inputs.runtime_run_id }}
          RUNTIME_HEAD_SHA: ${{ inputs.runtime_head_sha }}
          AIRGAP_STAGE_ROOT: ${{ vars.AIRGAP_STAGE_ROOT }}
        run: |
          set -Eeuo pipefail
          target_dir="${AIRGAP_STAGE_ROOT}/${RUNTIME_HEAD_SHA}-${RUNTIME_RUN_ID}"
          test -d "$target_dir"
          test ! -L "$target_dir"
          test "$(find "$target_dir" -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 3
          test "$(find "$target_dir" -mindepth 1 -maxdepth 1 ! -type f | wc -l)" -eq 0
          (
            cd "$target_dir"
            test "$(awk '{print $2}' cpu-runtime.sha256)" = $'cpu-runtime-amd64.tar\nsources.lock'
            sha256sum --check --strict cpu-runtime.sha256
            git -C "$GITHUB_WORKSPACE" show \
              "${RUNTIME_HEAD_SHA}:deploy/tss-aiplatform-internal/reproducible/cpu-runtime-images.lock" \
              > "$RUNNER_TEMP/exported-cpu-runtime-images.lock"
            cmp "$RUNNER_TEMP/exported-cpu-runtime-images.lock" sources.lock
            cmp "$GITHUB_WORKSPACE/deploy/tss-aiplatform-internal/reproducible/cpu-runtime-images.lock" \
              sources.lock
            test "$(grep -Evc '^(#|$)' sources.lock)" -eq 2
          )

      - name: Record staged CPU runtime result
        env:
          RUNTIME_RUN_ID: ${{ inputs.runtime_run_id }}
          RUNTIME_HEAD_SHA: ${{ inputs.runtime_head_sha }}
          AIRGAP_STAGE_ROOT: ${{ vars.AIRGAP_STAGE_ROOT }}
        run: |
          {
            echo "### Internal CPU runtime staging"
            echo "- Export run: \`${RUNTIME_RUN_ID}\`"
            echo "- Source SHA: \`${RUNTIME_HEAD_SHA}\`"
            echo "- Stage: \`${AIRGAP_STAGE_ROOT}/${RUNTIME_HEAD_SHA}-${RUNTIME_RUN_ID}\`"
            echo "- Checksums and two-source lock: passed"
            echo "- sudo, containerd import and workload scheduling: not attempted"
          } >> "$GITHUB_STEP_SUMMARY"

  stage-platform-images:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.task == 'stage-platform-images'
    runs-on: [self-hosted, Linux, X64, seu4080, deploy]
    environment: tss-aiplatform-internal
    timeout-minutes: 30
    steps:
      - name: Check out trusted backend-ops source
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false

      - name: Verify trusted platform-image export and isolated staging path
        env:
          PLATFORM_RUN_ID: ${{ inputs.platform_run_id }}
          PLATFORM_HEAD_SHA: ${{ inputs.platform_head_sha }}
          AIRGAP_STAGE_ROOT: ${{ vars.AIRGAP_STAGE_ROOT }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF" == "refs/heads/backend-ops" ]]
          [[ "$PLATFORM_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$PLATFORM_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$PLATFORM_HEAD_SHA" "$GITHUB_SHA"
          [[ "$AIRGAP_STAGE_ROOT" == /* ]]
          test -d "$AIRGAP_STAGE_ROOT"
          test ! -L "$AIRGAP_STAGE_ROOT"
          test "$(stat -c %U "$AIRGAP_STAGE_ROOT")" = "$(id -un)"
          stage_mode="$(stat -c %a "$AIRGAP_STAGE_ROOT")"
          (( (8#$stage_mode & 0022) == 0 ))
          stage_root="$(realpath -e "$AIRGAP_STAGE_ROOT")"
          test "$stage_root" = "$AIRGAP_STAGE_ROOT"
          target_dir="${stage_root}/${PLATFORM_HEAD_SHA}-${PLATFORM_RUN_ID}"
          test ! -e "$target_dir"
          test ! -L "$target_dir"

          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${PLATFORM_RUN_ID}" \
            --output "$RUNNER_TEMP/platform-export-run.json"
          python3 - "$RUNNER_TEMP/platform-export-run.json" \
            "$PLATFORM_HEAD_SHA" <<'PY'
          import json
          import sys

          metadata_path, expected_sha = sys.argv[1:]
          with open(metadata_path, encoding="utf-8") as metadata_file:
              metadata = json.load(metadata_file)
          expected = {
              "head_sha": expected_sha,
              "head_branch": "backend-ops",
              "event": "workflow_dispatch",
              "status": "completed",
              "conclusion": "success",
              "path": ".github/workflows/tss-aiplatform-internal-validation.yml",
          }
          mismatches = {
              key: (metadata.get(key), value)
              for key, value in expected.items()
              if metadata.get(key) != value
          }
          if mismatches:
              raise SystemExit(f"untrusted platform-image export metadata: {mismatches}")
          PY

      - name: Download exact platform-image artifact in verified ranges
        env:
          PLATFORM_RUN_ID: ${{ inputs.platform_run_id }}
          PLATFORM_HEAD_SHA: ${{ inputs.platform_head_sha }}
          AIRGAP_STAGE_ROOT: ${{ vars.AIRGAP_STAGE_ROOT }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 deploy/tss-aiplatform-internal/ci/download-airgap-artifact.py \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$PLATFORM_RUN_ID" \
            --head-sha "$PLATFORM_HEAD_SHA" \
            --stage-root "$AIRGAP_STAGE_ROOT" \
            --profile platform \
            --workers 16

      - name: Verify staged platform-image bundle before import
        env:
          PLATFORM_RUN_ID: ${{ inputs.platform_run_id }}
          PLATFORM_HEAD_SHA: ${{ inputs.platform_head_sha }}
          AIRGAP_STAGE_ROOT: ${{ vars.AIRGAP_STAGE_ROOT }}
        run: |
          set -Eeuo pipefail
          target_dir="${AIRGAP_STAGE_ROOT}/${PLATFORM_HEAD_SHA}-${PLATFORM_RUN_ID}"
          test -d "$target_dir"
          test ! -L "$target_dir"
          test "$(find "$target_dir" -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 3
          test "$(find "$target_dir" -mindepth 1 -maxdepth 1 ! -type f | wc -l)" -eq 0
          (
            cd "$target_dir"
            test "$(awk '{print $2}' platform-images.sha256)" = $'platform-images-amd64.tar\nsources.lock'
            sha256sum --check --strict platform-images.sha256
            git -C "$GITHUB_WORKSPACE" show \
              "${PLATFORM_HEAD_SHA}:deploy/tss-aiplatform-internal/platform/platform-images.lock" \
              > "$RUNNER_TEMP/exported-platform-images.lock"
            cmp "$RUNNER_TEMP/exported-platform-images.lock" sources.lock
            cmp "$GITHUB_WORKSPACE/deploy/tss-aiplatform-internal/platform/platform-images.lock" \
              sources.lock
            test "$(grep -Evc '^(#|$)' sources.lock)" -eq 4
          )

      - name: Record staged platform-image result
        env:
          PLATFORM_RUN_ID: ${{ inputs.platform_run_id }}
          PLATFORM_HEAD_SHA: ${{ inputs.platform_head_sha }}
          AIRGAP_STAGE_ROOT: ${{ vars.AIRGAP_STAGE_ROOT }}
        run: |
          {
            echo "### Internal platform-image staging"
            echo "- Export run: \`${PLATFORM_RUN_ID}\`"
            echo "- Source SHA: \`${PLATFORM_HEAD_SHA}\`"
            echo "- Stage: \`${AIRGAP_STAGE_ROOT}/${PLATFORM_HEAD_SHA}-${PLATFORM_RUN_ID}\`"
            echo "- Checksums and four-source lock: passed"
            echo "- sudo, Docker import and platform restart: not attempted"
          } >> "$GITHUB_STEP_SUMMARY"
