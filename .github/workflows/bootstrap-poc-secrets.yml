name: Bootstrap Backend POC Secrets

on:
  workflow_dispatch:
  push:
    tags:
      - "poc-bootstrap-*"

permissions:
  contents: read

concurrency:
  group: tss-backend-poc-secrets
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    environment: poc
    env:
      DEPLOY_HOST: ${{ vars.POC_DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.POC_DEPLOY_USER }}
      GHCR_USERNAME: ${{ vars.POC_GHCR_USERNAME }}
      GHCR_TOKEN: ${{ secrets.POC_GHCR_PULL_TOKEN }}
    steps:
      - name: Validate environment configuration
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$GHCR_USERNAME"
          test -n "$GHCR_TOKEN"

      - name: Load POC deployment key
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.POC_DEPLOY_SSH_PRIVATE_KEY }}

      - name: Trust Main server host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Refuse to overwrite existing POC secrets
        run: |
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "
            if kubectl -n tss-poc get secret tss-poc-datastore >/dev/null 2>&1; then
              echo 'POC secrets already exist. Use an explicit rotation procedure instead.' >&2
              exit 1
            fi
          "

      - name: Generate and apply POC-only secrets
        run: |
          set +x
          postgres_password="$(openssl rand -hex 24)"
          minio_root_user="poc$(openssl rand -hex 6)"
          minio_root_password="$(openssl rand -hex 24)"
          callback_token="$(openssl rand -hex 32)"
          docker_config="$(jq -cn --arg user "$GHCR_USERNAME" --arg token "$GHCR_TOKEN" '{auths: {"ghcr.io": {username: $user, password: $token, auth: (($user + ":" + $token) | @base64)}}}')"

          secret_file="${RUNNER_TEMP}/tss-poc-secrets.yaml"
          umask 077
          cat > "$secret_file" <<EOF
          apiVersion: v1
          kind: Secret
          metadata:
            name: tss-poc-datastore
            namespace: tss-poc
          type: Opaque
          stringData:
            POSTGRES_PASSWORD: "$postgres_password"
            MINIO_ROOT_USER: "$minio_root_user"
            MINIO_ROOT_PASSWORD: "$minio_root_password"
          ---
          apiVersion: v1
          kind: Secret
          metadata:
            name: tss-backend-runtime
            namespace: tss-poc
          type: Opaque
          stringData:
            SPRING_PROFILES_ACTIVE: "default"
            SPRING_DATASOURCE_URL: "jdbc:postgresql://tss-postgres:5432/tss_poc"
            SPRING_DATASOURCE_USERNAME: "postgres"
            SPRING_DATASOURCE_PASSWORD: "$postgres_password"
            MINIO_ENDPOINT: "http://tss-minio:9000"
            MINIO_ACCESS_KEY: "$minio_root_user"
            MINIO_SECRET_KEY: "$minio_root_password"
            MINIO_BUCKET: "tss-poc"
            TRAINING_MLFLOW_ENABLED: "false"
            TRAINING_KUBERNETES_ENABLED: "false"
            TRAINING_KUBERNETES_VERIFY_ON_STARTUP: "false"
            TRAINING_KUBERNETES_INTERNAL_CALLBACK_TOKEN: "$callback_token"
          ---
          apiVersion: v1
          kind: Secret
          metadata:
            name: ghcr-pull
            namespace: tss-poc
          type: kubernetes.io/dockerconfigjson
          stringData:
            .dockerconfigjson: '$docker_config'
          EOF

          cat "$secret_file" | ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "kubectl apply -f -"
          rm -f "$secret_file"

      - name: Verify secret names only
        run: |
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "
            kubectl -n tss-poc get secret tss-poc-datastore tss-backend-runtime ghcr-pull
          "
