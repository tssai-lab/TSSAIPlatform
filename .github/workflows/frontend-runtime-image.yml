name: Frontend Runtime Image

on:
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "deploy/nginx/**"
      - "package.json"
      - "package-lock.json"
      - ".npmrc"
      - "config/**"
      - "public/**"
      - "scripts/**"
      - "src/**"
      - ".github/workflows/frontend-runtime-image.yml"
  push:
    branches:
      - frontend-dev
      - frontend-main
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "deploy/nginx/**"
      - "package.json"
      - "package-lock.json"
      - ".npmrc"
      - "config/**"
      - "public/**"
      - "scripts/**"
      - "src/**"
      - ".github/workflows/frontend-runtime-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build immutable linux-amd64 frontend image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository_owner }}/tssai-frontend:${{ github.sha }}
          build-args: |
            VCS_REF=${{ github.sha }}
          provenance: false
          sbom: false

      - name: Record immutable image identity
        if: github.event_name != 'pull_request'
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$IMAGE_DIGEST"
          source_ref="ghcr.io/${GITHUB_REPOSITORY_OWNER}/tssai-frontend:${GITHUB_SHA}"
          immutable_ref="${source_ref}@${IMAGE_DIGEST}"
          runtime_ref="docker.io/library/tss-aiplatform-frontend:${GITHUB_SHA:0:12}"
          docker pull --quiet --platform linux/amd64 "$immutable_ref" >/dev/null
          image_id="$(docker image inspect --format '{{.Id}}' "$immutable_ref")"
          image_size="$(docker image inspect --format '{{.Size}}' "$immutable_ref")"
          image_platform="$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$immutable_ref")"
          image_revision="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$immutable_ref")"
          fingerprint="$(docker image inspect "$immutable_ref" | python3 scripts/image-runtime-fingerprint.py)"
          [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$fingerprint" =~ ^[0-9a-f]{64}$ ]]
          [[ "$image_platform" == linux/amd64 ]]
          [[ "$image_revision" == "$GITHUB_SHA" ]]
          (( image_size > 0 && image_size <= 200 * 1024 * 1024 ))
          docker tag "$immutable_ref" "$runtime_ref"
          docker image save --output "$RUNNER_TEMP/frontend-image-size-check.tar" "$runtime_ref"
          archive_size="$(stat -c %s "$RUNNER_TEMP/frontend-image-size-check.tar")"
          (( archive_size > 0 && archive_size <= 250 * 1024 * 1024 ))
          rm -f "$RUNNER_TEMP/frontend-image-size-check.tar"
          printf '%s|%s|%s|%s|%s|%s\n' \
            "$source_ref" "$IMAGE_DIGEST" "$runtime_ref" "$image_id" \
            "$fingerprint" 268435456 \
            > "$RUNNER_TEMP/frontend-image.lock-candidate"
          {
            printf 'source_sha=%s\n' "$GITHUB_SHA"
            printf 'source_manifest_digest=%s\n' "$IMAGE_DIGEST"
            printf 'image_id=%s\n' "$image_id"
            printf 'runtime_fingerprint_sha256=%s\n' "$fingerprint"
            printf 'docker_image_bytes=%s\n' "$image_size"
            printf 'docker_archive_bytes=%s\n' "$archive_size"
          } > "$RUNNER_TEMP/frontend-image.metadata"
          {
            echo "### Frontend runtime image"
            printf '%s\n' "- Source SHA: \`${GITHUB_SHA}\`"
            printf '%s\n' "- Image: \`ghcr.io/${GITHUB_REPOSITORY_OWNER}/tssai-frontend:${GITHUB_SHA}\`"
            printf '%s\n' "- Digest: \`${IMAGE_DIGEST}\`"
            printf '%s\n' "- Image ID: \`${image_id}\`"
            printf '%s\n' "- Docker archive bytes: \`${archive_size}\`"
            printf '%s\n' "- Published: \`${{ github.event_name != 'pull_request' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reviewed identity candidate
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: tss-aiplatform-frontend-identity-${{ github.sha }}
          path: |
            ${{ runner.temp }}/frontend-image.lock-candidate
            ${{ runner.temp }}/frontend-image.metadata
          if-no-files-found: error
          retention-days: 7

      - name: Record pull-request validation result
        if: github.event_name == 'pull_request'
        run: |
          {
            echo "### Frontend runtime image"
            printf '%s\n' "- Source SHA: \`${GITHUB_SHA}\`"
            echo "- linux/amd64 image build: passed"
            printf '%s\n' '- Published: `false`'
          } >> "$GITHUB_STEP_SUMMARY"
