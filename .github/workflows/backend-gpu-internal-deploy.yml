name: 内网 GPU 分支部署

on:
  workflow_call:
    inputs:
      application_sha:
        description: Exact tested backend-gpu application commit
        required: true
        type: string

concurrency:
  group: tss-aiplatform-internal-deploy
  cancel-in-progress: false

jobs:
  promote-release-lock:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    outputs:
      release_sha: ${{ steps.release.outputs.release_sha }}
    steps:
      - name: Check out the exact backend-gpu source
        uses: actions/checkout@v4
        with:
          ref: backend-gpu
          fetch-depth: 0

      - name: Verify only the reviewed frontend lock followed the tested backend
        env:
          APPLICATION_SHA: ${{ inputs.application_sha }}
        run: |
          set -Eeuo pipefail
          [[ "$APPLICATION_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin \
            refs/heads/backend-gpu:refs/remotes/origin/backend-gpu
          current_head="$(git rev-parse refs/remotes/origin/backend-gpu)"
          [[ "$(git rev-parse HEAD)" == "$current_head" ]]
          git merge-base --is-ancestor "$APPLICATION_SHA" "$current_head"
          changed_after_test="$(git diff --name-only "$APPLICATION_SHA..$current_head" | sort -u)"
          allowed_post_test_file='deploy/tss-aiplatform-internal/platform/frontend-image.lock'
          [[ -z "$changed_after_test" || "$changed_after_test" == "$allowed_post_test_file" ]]

      - name: Log in to the project image registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Promote the exact backend image into the protected lock
        env:
          APPLICATION_SHA: ${{ inputs.application_sha }}
        run: |
          set -Eeuo pipefail
          bash deploy/tss-aiplatform-internal/platform/scripts/promote-backend-image-lock.sh \
            "$APPLICATION_SHA"
          changed_files="$(git diff --name-only | sort)"
          expected_files=$'deploy/tss-aiplatform-internal/platform/platform-images.lock\ndeploy/tss-aiplatform-internal/platform/platform.env.example'
          [[ "$changed_files" == "$expected_files" ]]
          bash deploy/tss-aiplatform-internal/tests/test-platform-copy.sh

      - name: Commit the immutable internal release lock without recursion
        id: release
        env:
          APPLICATION_SHA: ${{ inputs.application_sha }}
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            deploy/tss-aiplatform-internal/platform/platform-images.lock \
            deploy/tss-aiplatform-internal/platform/platform.env.example
          git diff --cached --check
          git commit -m "chore(gpu): lock internal backend ${APPLICATION_SHA:0:12} [skip ci]"
          release_sha="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/backend-gpu"
          echo "release_sha=${release_sha}" >> "$GITHUB_OUTPUT"

  export-backend-image:
    needs: promote-release-lock
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out the exact internal release
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.promote-release-lock.outputs.release_sha }}
          persist-credentials: false

      - name: Log in to the project image registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Export the registry-locked backend image
        run: |
          set -Eeuo pipefail
          output_dir="$RUNNER_TEMP/tss-aiplatform-backend-image"
          install -d -m 0700 "$output_dir"
          bash deploy/tss-aiplatform-internal/platform/scripts/export-platform-images.sh \
            --backend-only > "$output_dir/backend-image-amd64.tar"
          grep '^ghcr.io/tssai-lab/tssai-backend:' \
            deploy/tss-aiplatform-internal/platform/platform-images.lock \
            > "$output_dir/sources.lock"
          (
            cd "$output_dir"
            sha256sum backend-image-amd64.tar sources.lock > backend-image.sha256
            sha256sum --check --strict backend-image.sha256
          )

      - name: Upload the short-lived backend bundle
        uses: actions/upload-artifact@v4
        with:
          name: tss-aiplatform-internal-backend-${{ needs.promote-release-lock.outputs.release_sha }}
          path: ${{ runner.temp }}/tss-aiplatform-backend-image
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  deploy-backend:
    needs:
      - promote-release-lock
      - export-backend-image
    runs-on: [self-hosted, Linux, X64, tss-aiplatform-internal, deploy]
    environment: tss-aiplatform-internal
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out the exact internal release
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.promote-release-lock.outputs.release_sha }}
          clean: true
          fetch-depth: 0
          persist-credentials: false

      - name: Download the exact backend bundle onto the mechanical Runner disk
        uses: actions/download-artifact@v4
        with:
          name: tss-aiplatform-internal-backend-${{ needs.promote-release-lock.outputs.release_sha }}
          path: ${{ runner.temp }}/tss-aiplatform-backend-image

      - name: Verify, synchronize and deploy through the restricted gateway
        env:
          APPLICATION_SHA: ${{ inputs.application_sha }}
          RELEASE_SHA: ${{ needs.promote-release-lock.outputs.release_sha }}
          CONTROL_PLANE_HOST: ${{ vars.CONTROL_PLANE_HOST }}
          CONTROL_PLANE_DEPLOYMENT_USER: ${{ vars.CONTROL_PLANE_DEPLOYMENT_USER }}
          CONTROL_PLANE_SSH_KEY: ${{ vars.CONTROL_PLANE_SSH_KEY }}
          CONTROL_PLANE_KNOWN_HOSTS: ${{ vars.CONTROL_PLANE_KNOWN_HOSTS }}
          RUNNER_WORK_ROOT: ${{ vars.RUNNER_WORK_ROOT }}
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF" == "refs/heads/backend-gpu" ]]
          [[ "$APPLICATION_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]]
          [[ "$CONTROL_PLANE_HOST" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}$ ]]
          [[ "$CONTROL_PLANE_DEPLOYMENT_USER" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]]
          [[ "$CONTROL_PLANE_SSH_KEY" == /* && "$CONTROL_PLANE_KNOWN_HOSTS" == /* ]]
          [[ "$RUNNER_WORK_ROOT" == /* && "$RUNNER_WORK_ROOT" != / ]]
          test -d "$RUNNER_WORK_ROOT"
          test ! -L "$RUNNER_WORK_ROOT"
          runner_work_root="$(realpath -e "$RUNNER_WORK_ROOT")"
          [[ "$RUNNER_TEMP" == "${runner_work_root}/"* ]]
          test -f "$CONTROL_PLANE_SSH_KEY"
          test ! -L "$CONTROL_PLANE_SSH_KEY"
          test "$(stat -c %U "$CONTROL_PLANE_SSH_KEY")" = "$(id -un)"
          test "$(stat -c %a "$CONTROL_PLANE_SSH_KEY")" = 600
          test -f "$CONTROL_PLANE_KNOWN_HOSTS"
          test ! -L "$CONTROL_PLANE_KNOWN_HOSTS"
          known_hosts_mode="$(stat -c %a "$CONTROL_PLANE_KNOWN_HOSTS")"
          (( (8#$known_hosts_mode & 0022) == 0 ))

          bundle_root="$RUNNER_TEMP/tss-aiplatform-backend-image"
          test "$(find "$bundle_root" -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 3
          test "$(find "$bundle_root" -mindepth 1 -maxdepth 1 ! -type f | wc -l)" -eq 0
          (
            cd "$bundle_root"
            test "$(awk '{print $2}' backend-image.sha256)" = $'backend-image-amd64.tar\nsources.lock'
            sha256sum --check --strict backend-image.sha256
            grep '^ghcr.io/tssai-lab/tssai-backend:' \
              "$GITHUB_WORKSPACE/deploy/tss-aiplatform-internal/platform/platform-images.lock" \
              > "$RUNNER_TEMP/current-backend.lock"
            cmp "$RUNNER_TEMP/current-backend.lock" sources.lock
            grep -E "^ghcr.io/tssai-lab/tssai-backend:${APPLICATION_SHA}\\|" sources.lock
          )

          ssh_options=(
            -i "$CONTROL_PLANE_SSH_KEY"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=${CONTROL_PLANE_KNOWN_HOSTS}"
            -o ConnectTimeout=10
          )
          ssh_with_retry() {
            local attempt
            for attempt in 1 2 3 4; do
              if ssh "${ssh_options[@]}" \
                "${CONTROL_PLANE_DEPLOYMENT_USER}@${CONTROL_PLANE_HOST}" "$@"; then
                return 0
              fi
              (( attempt < 4 )) || return 1
              sleep $((attempt * 2))
            done
          }
          stage_backend_with_retry() {
            local attempt
            for attempt in 1 2 3 4; do
              # The gateway writes into a temporary file and only promotes a
              # complete bundle. Replaying this stage is therefore safe; an
              # already promoted identical bundle is accepted by its digest.
              if tar -C "$bundle_root" -cf - \
                backend-image-amd64.tar backend-image.sha256 sources.lock \
                | ssh "${ssh_options[@]}" \
                    "${CONTROL_PLANE_DEPLOYMENT_USER}@${CONTROL_PLANE_HOST}" stage-backend; then
                return 0
              fi
              (( attempt < 4 )) || return 1
              sleep $((attempt * 5))
            done
          }
          ssh_with_retry probe
          sleep 2
          ssh_with_retry "sync ${RELEASE_SHA}"
          sleep 2
          stage_backend_with_retry
          sleep 2
          ssh "${ssh_options[@]}" "${CONTROL_PLANE_DEPLOYMENT_USER}@${CONTROL_PLANE_HOST}" deploy-backend
          sleep 2
          ssh_with_retry probe \
            | tee "$RUNNER_TEMP/internal-backend-deployment-state.txt"
          grep -Fx "TSS_APPLICATION_SOURCE_SHA=${APPLICATION_SHA}" \
            "$RUNNER_TEMP/internal-backend-deployment-state.txt"
          grep -Fx "TSS_INFRASTRUCTURE_SHA=${RELEASE_SHA}" \
            "$RUNNER_TEMP/internal-backend-deployment-state.txt"

      - name: Record isolated internal deployment result
        run: |
          {
            echo "### Internal backend-gpu deployment"
            echo "- Application SHA: \`${{ inputs.application_sha }}\`"
            echo "- Release lock SHA: \`${{ needs.promote-release-lock.outputs.release_sha }}\`"
            echo "- External Main cluster: not targeted"
            echo "- Mechanical-disk Runner, immutable image and restricted gateway checks: passed"
          } >> "$GITHUB_STEP_SUMMARY"
