name: Frontend Image Isolation Validation

on:
  push:
    branches:
      - ops/seu4080-frontend-image
    paths:
      - Dockerfile
      - .dockerignore
      - deploy/nginx/default.conf.template
      - .github/workflows/frontend-image-isolated.yml

permissions:
  contents: read
  packages: write

jobs:
  build-validate-push:
    name: Build and validate frontend image without deployment
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      IMAGE_REF: ghcr.io/${{ github.repository_owner }}/tssai-frontend:${{ github.sha }}
    steps:
      - name: Check out isolated branch
        uses: actions/checkout@v4

      - name: Log in to GHCR on the ephemeral runner
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build immutable frontend image
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --pull \
            --build-arg "VCS_REF=${GITHUB_SHA}" \
            --tag "$IMAGE_REF" \
            .

      - name: Run isolated container smoke test
        shell: bash
        run: |
          set -euo pipefail
          container="tssai-frontend-smoke-${GITHUB_RUN_ID}"
          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach \
            --name "$container" \
            --publish 127.0.0.1:18081:80 \
            --env BACKEND_UPSTREAM=http://127.0.0.1:65535 \
            --env MLFLOW_UPSTREAM=http://127.0.0.1:65535 \
            "$IMAGE_REF"

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:18081/healthz; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs "$container"
              exit 1
            fi
            sleep 1
          done

          docker exec "$container" nginx -t
          curl --fail --silent --show-error http://127.0.0.1:18081/ > /tmp/frontend-index.html
          test -s /tmp/frontend-index.html
          grep --ignore-case --quiet '<html' /tmp/frontend-index.html

      - name: Push validated image only
        shell: bash
        run: |
          set -euo pipefail
          docker push "$IMAGE_REF"

      - name: Report immutable reference
        shell: bash
        run: echo "validated-image=${IMAGE_REF}"
