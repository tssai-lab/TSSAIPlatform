name: Deploy Main Backend Validation

on:
  workflow_call:
    inputs:
      image_tag:
        description: Commit SHA image tag produced by Backend CI and Image
        required: true
        type: string
      target_environment:
        description: GitHub Environment containing the target node credentials
        required: false
        default: main
        type: string
      target_name:
        description: Stable target node identifier used for logs and concurrency
        required: false
        default: main
        type: string
  workflow_dispatch:
    inputs:
      image_tag:
        description: Commit SHA image tag produced by Backend CI and Image
        required: true
        type: string
      target_environment:
        description: GitHub Environment containing the target node credentials
        required: false
        default: main
        type: string
      target_name:
        description: Stable target node identifier used for logs and concurrency
        required: false
        default: main
        type: string
  push:
    tags:
      - "main-deploy-*"

permissions:
  contents: read
  packages: read

concurrency:
  group: tss-${{ inputs.target_name || 'main' }}-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment || 'main' }}
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Check out deployment ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate deployment configuration
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_KNOWN_HOSTS"

      - name: Resolve immutable image tag
        id: image
        env:
          REQUESTED_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ -n "$REQUESTED_IMAGE_TAG" ]]; then
            image_tag="$REQUESTED_IMAGE_TAG"
          else
            image_tag="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          fi
          [[ "$image_tag" =~ ^[0-9a-f]{40}$ ]]
          echo "tag=$image_tag" >> "$GITHUB_OUTPUT"

      - name: Load deployment key
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}

      - name: Trust verified target host key
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Log GitHub runner in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Transfer image and deploy target backend
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/tssai-backend:${{ steps.image.outputs.tag }}"
          docker pull "$image"
          image_id="$(docker image inspect "$image" --format '{{.Id}}')"
          set -o pipefail
          docker save "$image" \
            | gzip -1 \
            | ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "sudo -n /usr/local/sbin/tss-node-load-backend '$image' '$image_id'"
