name: Backend CI and Image

on:
  pull_request:
    paths:
      - "backend/**"
      - "deploy/**"
      - "k8s/**"
      - ".github/workflows/**"
  push:
    branches:
      - backend-ops
    paths:
      - "backend/**"
      - "deploy/**"
      - "k8s/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.backend_image.outputs.digest }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate deployment shell syntax
        run: |
          find backend/scripts deploy/scripts k8s \
            -type f -name '*.sh' -print0 \
            | xargs -0 -r -n1 bash -n

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run tests
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable image
        id: backend_image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/tssai-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-main:
    name: Deploy successful backend-ops image to Main
    needs: verify-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/backend-ops'
    uses: ./.github/workflows/deploy-main-validation.yml
    with:
      image_tag: ${{ github.sha }}
      image_digest: ${{ needs.verify-and-build.outputs.image_digest }}
      target_environment: main
      target_name: main
    secrets: inherit

  deploy-seu4080:
    name: Deploy successful backend-ops image to seu4080
    needs: verify-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/backend-ops'
    uses: ./.github/workflows/deploy-seu4080-backend.yml
    with:
      image_tag: ${{ github.sha }}
      image_digest: ${{ needs.verify-and-build.outputs.image_digest }}
    secrets: inherit
