name: 后端服务自动部署

on:
  pull_request:
    paths:
      - "backend/**"
      - "deploy/**"
      - "!deploy/tss-aiplatform-internal/**"
      - "k8s/**"
      - ".github/workflows/**"
  push:
    branches:
      - backend-ops
    paths:
      - "backend/**"
      - "deploy/**"
      - "!deploy/tss-aiplatform-internal/**"
      - "k8s/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    outputs:
      deploy_main: ${{ steps.scope.outputs.deploy_main }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify Main deployment scope
        id: scope
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "deploy_main=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "deploy_main=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]]; then
            BEFORE_SHA="${CURRENT_SHA}^"
          fi
          git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" \
            | bash deploy/tss-aiplatform-internal/ci/classify-backend-deploy-scope.sh \
            >> "$GITHUB_OUTPUT"

      - name: Validate deployment shell syntax
        run: |
          find backend/scripts deploy/scripts k8s \
            -type f -name '*.sh' -print0 \
            | xargs -0 -r -n1 bash -n
          find deploy/scripts -maxdepth 1 -type f -name 'tss-node-*' -print0 \
            | xargs -0 -r -n1 bash -n

      - name: Run deployment validation contract tests
        run: bash deploy/scripts/tests/test-tss-node-validation.sh

      - name: Run inference worker unit tests
        run: |
          python3 -m unittest discover -s k8s/inference-worker -p 'test_*.py' -v

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run tests
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: >-
          github.event_name != 'pull_request' &&
          steps.scope.outputs.deploy_main == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable image
        if: >-
          github.event_name != 'pull_request' &&
          steps.scope.outputs.deploy_main == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/tssai-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-main:
    name: Deploy successful backend-ops image to Main
    needs: verify-and-build
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/backend-ops' &&
      needs.verify-and-build.outputs.deploy_main == 'true'
    uses: ./.github/workflows/deploy-main-validation.yml
    with:
      image_tag: ${{ github.sha }}
      target_environment: main
      target_name: main
    secrets: inherit
